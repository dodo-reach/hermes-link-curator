{% extends "base.html" %}
{% from "_components.html" import entry_card %}

{% block content %}
<div class="container">
  <div class="view-heading">
    <a href="/">← All links</a>
    <span>· {{ tag_entries|length }} link{% if tag_entries|length != 1 %}s{% endif %} tagged #{{ tag }}</span>
  </div>
  <div class="days-list search-results">
    {% for entry in tag_entries %}{{ entry_card(entry) }}{% endfor %}
  </div>
</div>
{% endblock %}
