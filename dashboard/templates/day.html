{% extends "base.html" %}
{% from "_components.html" import entry_card %}

{% block content %}
<div class="container">
  <div class="view-heading">
    <a href="/">← All links</a>
    <span>· {{ day_entries|length }} link{% if day_entries|length != 1 %}s{% endif %} on {{ day_label }}</span>
  </div>
  <div class="days-list search-results">
    {% for entry in day_entries %}{{ entry_card(entry) }}{% endfor %}
  </div>
</div>
{% endblock %}
